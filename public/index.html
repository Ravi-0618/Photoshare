<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PhotoShare | Your Cloud Gallery</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
  <div class="brand">☁ PhotoShare</div>

  <div class="auth-controls">
    <button id="loginBtn" type="button">Sign in</button>
    <button id="logoutBtn" type="button" hidden>Log out</button>
    <span id="userStatus">Not signed in</span>
  </div>
</header>
  <main>
    <section class="hero"><h1>Your memories, beautifully shared.</h1><p>Upload photos and explore your personal gallery.</p></section>
    <section class="upload-panel" id="uploadPanel" hidden>
      <h2>Upload a photo</h2>
      <form id="uploadForm"><label for="photo">Choose an image (JPG, PNG, WEBP, GIF, max 5 MB)</label><input type="file" name="photo" id="photo" accept="image/jpeg,image/png,image/webp,image/gif" required /><button type="submit">Upload photo</button></form>
      <p id="message" role="status"></p>
    </section>
    <section><div class="gallery-heading"><h2>Photo gallery</h2><button class="secondary" id="refresh" type="button">Refresh</button></div><div id="gallery" class="gallery"></div></section>
  </main>
  <footer>PhotoShare · AWS Cloud Computing Project</footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
